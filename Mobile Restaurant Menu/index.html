<html>
    <head>
       <title>Restaurant Mobile Menu</title>
       <link rel="stylesheet" href="index.css">
       <link rel="preconnect" href="https://fonts.googleapis.com">
       <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
       <link href="https://fonts.googleapis.com/css2?family=Smythe&display=swap" rel="stylesheet">
    </head>
    <body>
    <!-- start header -->
    <header id="header" class="header">
        <div class="container">
            <div class="text">    
                <h1 class="owner-name">Jimmy’s Diner</h1>
                <p class="owner-subtitle">The best burgers and pizzas in town.</p>
            </div>
        </div>
    </header>

    <!-- start ordering -->
    <section id="ordering" class="ordering">
        <div class="container">
            <ul></ul>
        </div>
    </section>

    <!-- start checkout -->
    <section id="checkout" class="checkout">
        <div class="container">
            <h3 class="checkout-title">Your order</h3>
            <ul class="orders">
            </ul>
            <div class="total">
                <h4 class="total-price">Total price: </h4>
                <span class="total-amount"></span>
            </div>
            <button class="complete-order">Complete order</button>
        </div>
    </section>
	<script src="index.js" type="module"></script>
    </body>
</html>
